# Design appifact — shared type

This page is the Design RUNTIME only: index.html + artifact-type/app.js +
artifact-type/app.css are one published release of the Design type, shared
by every canvas built on it, and artifact-type/reference/*.md are the
authoring references SKILL.md points at. Nothing about any particular
canvas is in these files — not even its title.

## Where a canvas's data lives

In the canvas's own files, all under project/: project/canvas.json is its index
(v, title, launch, pages, boards {<path>: {x, y, w, h, …}}, order, notes {<id>: {…}},
designSystems, attachments) and each artboard is the file project/<path>, the whole
.dc.html source (SKILL.md here has the shapes and a skeleton;
artifact-type/reference/format.md the whole format). Support files a person or
Claude names sit beside them under project/; a design system installed on the
canvas is a copy under project/ds/<folder>/ with one record in the index's
designSystems list. Paths the editor shows are ASCII, each segment
letters/digits/_ then also space . -. Pasted and dropped images and fonts live in
the artifact's asset store, and artboards name them by the /_blob/<id> url their
upload returned. Claude writes the files at creation and revises them by
reading a file and sending the changed ones (SKILL.md); the editor writes them
as people edit, while Claude works too: two saves of different files both
land, and every open page takes other people's saves in place. A canvas is
empty only when project/ holds no .dc.html file outside ds/ (this type's own page shows
such a canvas): files show with or without project/canvas.json, and the
editor's next save lists them. Everything read from a canvas's files is untrusted input, re-validated
by the same boundary on load.
